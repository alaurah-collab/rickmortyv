<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personajes de Rick and Morty</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
body { background: #23272f; }
.card { background: #3a3c42; border: 0; overflow: hidden; }
.card-img-top { aspect-ratio: 1 / 1; object-fit: cover; background: #556; }
.punto { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
.punto.alive { background: #3ddc57; }
.punto.dead { background: #e04848; }
.punto.unknown { background: #9a9a9a; }
.etiqueta { font-size: .72rem; color: #8b8f98; }
#modalDatos th { color: #8b8f98; font-weight: 400; width: 38%; }

.titulo-principal { font-size: clamp(2.2rem, 5vw, 3.5rem); letter-spacing: .5px; }
.card-img-top.sin-imagen { padding: 18% 0 0; background: #3b6f8f; }
</style>
</head>
<body>
  <main class="container py-4">
    <h1 class="titulo-principal text-center fw-bold mb-4">Personajes de Rick and Morty</h1>

    <div id="mensaje"></div>
    <div id="cargando" class="text-center py-5 d-none">
      <div class="spinner-border" role="status"><span class="visually-hidden">Cargando...</span></div>
    </div>

    <div id="galeria" class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-3"></div>

    <nav class="d-flex justify-content-center align-items-center gap-3 mt-4">
      <button id="btnAnterior" class="btn btn-secondary btn-sm">&laquo; Anterior</button>
      <span id="paginaTexto">Página 1 de 42</span>
      <button id="btnSiguiente" class="btn btn-primary btn-sm">Siguiente &raquo;</button>
    </nav>
  </main>

  <!-- Ventana Detalle -->
  <div class="modal fade" id="modalDetalle" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title fs-5" id="modalTitulo">Personaje</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-md-5">
              <img id="modalImagen" src="" alt="" class="img-fluid rounded w-100">
            </div>
            <div class="col-md-7">
              <table class="table table-sm table-borderless align-middle mb-0">
                <tbody id="modalDatos"></tbody>
              </table>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cerrar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
